# Qwen3.8-27B on Strix Halo (gfx1151) — draft-mtp profiles
# Measured 2026-08-15 on NUCBox (Ryzen AI Max+ 395, 91GB LPDDR5X, GTT 64GB),
# llama.cpp b10435-era dflash build (9d57ce4), UD-Q4_K_XL, -c 32768, FA on,
# --jinja, thinking default off. Bench: streamed count-to-30 / code / 300w-story.
# c30 median / code median / story (tok/s content). Acceptance = mean-len.

[model]
path      = models--unsloth--Qwen3.8-27B-GGUF/.../Qwen3.8-27B-UD-Q4_K_XL.gguf
alias     = Qwen3.8-27B
ctx       = 98304        # PROMOTED 08:25Z: KV is ~2.1GB per 32k on this GQA
gpu       = -ngl 99 --flash-attn on -fit off   # model, so ctx is nearly free;
sampling  = --chat-template-kwargs "{\"enable_thinking\": false}"  # 96k @ 0 speed cost
env       = HSA_ENABLE_SDMA=0 HSA_XNACK=1      # GTT 55.3/64GB, 8.7GB margin

[profile.production]   # PROMOTED 2026-08-15 09:45Z — stacked spec, the full night's juice
spec     = --spec-type draft-mtp,ngram-mod --spec-draft-n-max 12 --spec-ngram-mod-n-min 24
measured = c30 59.7 cold / 157.6 warm | code 36.8 | story 11.0   (vs night-start 32.7/27.8/10.6)
accept   = c30 0.965 mean-len 37.7 (ngram) | rewrite 72-109 tok/s (vs 42 mtp-only)
note     = evolution: mtp-n6 32.7 -> mtp-n9 55.7 -> +ngram-mod 89.6-92.3 warm
           -> n12 94.7-98.5 -> n-min 24 148-158 warm. n16 regresses (deep-draft
           waste). Cold-path speed is unchanged by ngram (zero-cost option).

[profile.creative]     # long-form / storytelling lane (NOT default: code cost)
spec     = --spec-type draft-mtp,ngram-mod --spec-draft-n-max 12 --spec-ngram-mod-n-min 24 --spec-draft-p-min 0.75
measured = story median 14.0 vs 11.0 without p_min (+27%), code 31.8 in-band
mechanism= truncates low-confidence MTP drafts -> stops paying for rejected
           verify positions on diverse text.

[profile.saturated]    # deterministic/structured output (counting, JSON, tool args)
spec     = --spec-type draft-mtp --spec-draft-n-max 12
measured = c30 trend n6 32.7 -> n9 55.7 -> n10 58.6 (still climbing; verify
           acceptance stays ~1.0 before adopting; NOT promoted — code regresses)
